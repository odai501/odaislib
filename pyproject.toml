[tool.poetry]
name = "odaislib"
version = "1.12.1"
description = "A comprehensive Python library for API extraction and automation"
authors = ["Odai @K33K1"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/odai501/odaislib"
homepage = "https://github.com/odai501/odaislib"
documentation = "https://odai501.github.io/odaislib/"
packages = [{ include = "odaislib", from = "src" }]

[tool.poetry.dependencies]
python = "^3.10"
requests = "^2.31.0"
httpx = "^0.27.0"
user-agent = "^0.1.10"
beautifulsoup4 = "^4.12.3"
pycryptodome = "^3.20.0"
urllib3 = "^2.2.1"

[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
pytest-cov = "^7.1.0"
pytest-mock = "^3.15.1"
black = "^26.5.1"
ruff = "^0.16.7"
mypy = "^2.3.0"
pre-commit = "^4.6.1"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]